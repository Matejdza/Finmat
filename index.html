20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ECEAE6\" stroke-width=\"1.5\" aria-hidden=\"true\" style=\"margin-top: 4px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><div><b style=\"display: block; font-weight: 500\">Cena poznata unapred<\/b><span style=\"color: #9A968F; font-size: 15.2px\">Pisana ponuda po stavkama pre početka. Plaćate ono što je dogovoreno, bez skrivenih troškova.<\/span><\/div><\/li>\n<li style=\"display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding: 18px 0; border-bottom: 1px solid #33322F\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ECEAE6\" stroke-width=\"1.5\" aria-hidden=\"true\" style=\"margin-top: 4px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><div><b style=\"display: block; font-weight: 500\">Rok koji se poštuje<\/b><span style=\"color: #9A968F; font-size: 15.2px\">Dinamiku radova znate pre početka, a mi vas redovno obaveštavamo kako posao napreduje.<\/span><\/div><\/li>\n<li style=\"display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding: 18px 0; border-bottom: 1px solid #33322F\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ECEAE6\" stroke-width=\"1.5\" aria-hidden=\"true\" style=\"margin-top: 4px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><div><b style=\"display: block; font-weight: 500\">Jedan kontakt<\/b><span style=\"color: #9A968F; font-size: 15.2px\">Uvek znate koga zovete i ko je odgovoran.<\/span><\/div><\/li>\n<li style=\"display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding: 18px 0; border-bottom: 1px solid #33322F\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ECEAE6\" stroke-width=\"1.5\" aria-hidden=\"true\" style=\"margin-top: 4px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><div><b style=\"display: block; font-weight: 500\">Pravi redosled radova<\/b><span style=\"color: #9A968F; font-size: 15.2px\">Elektro i vodovod se -transform: uppercase\">Gotovo<\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><label class=\"lbl\" for=\"d-opis\">Opis posla <em>(nije obavezno)<\/em><\/label><textarea class=\"inp\" id=\"d-opis\" placeholder=\"Npr. kompletno renoviranje kupatila, zamena instalacija, stan je prazan...\" value=\"{{v.opis}}\" onChange=\"{{on.opis}}\"><\/textarea><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><label class=\"lbl\" for=\"d-kontakt\">Kako da vas kontaktiramo<\/label><select class=\"inp\" id=\"d-kontakt\" value=\"{{v.kontakt}}\" onChange=\"{{on.kontakt}}\"><option>Poziv<\/option><option>Viber<\/option><option>WhatsApp<\/option><option>Email<\/option><\/select><\/div>\n<div><button class=\"btn btn-solid\" type=\"button\" onClick=\"{{send}}\" aria-busy=\"{{sendBusy}}\">{{sendLabel}}<\/button>\n<input type=\"checkbox\" name=\"botcheck\" class=\"hp\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" onChange=\"{{hpOn}}\"><\/div>\n<p style=\"margin: 0; font-size: 13.12px; color: #5C5850\">Vaše podatke koristimo samo da bismo odgovorili na upit. Detalji su u politici privatnosti ispod forme.<\/p>\n<\/form>\n<\/sc-if>\n<sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"sentcard\" data-st=\"{{mailState}}\" role=\"status\" aria-live=\"polite\" style=\"display: flex; flex-direction: column; gap: 18px; background: #171716; border: 1px solid #2B2A28; padding: 40px; color: #ECEAE6; box-shadow: 0 18px 40px rgba(20,20,19,.18)\">\n<p class=\"eyebrow\">{{sentEyebrow}}<\/p>\n<h3 class=\"sf\" style=\"margin: 0; font-size: 32px; font-weight: 500; line-height: 1.08\">{{sentTitle}}<\/h3>\n<p style=\"margin: 0\">{{sentText}}<\/p>\n<sc-if value=\"{{showMsg}}\" hint-placeholder-val=\"{{true}}\"><pre style=\"white-space: pre-wrap; font: 400 14.72px/1.55 'Jost', sans-serif; background: #FFFFFF; border: 1px solid #CFC9BF; padding: 16px; margin: 0; max-height: 260px; overflow: auto\">{{msg}}<\/pre><\/sc-if>\n<p class=\"lbl\" style=\"margin: 4px 0 -6px\">{{waLabel}}<\/p>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n<a class=\"btn btn-solid\" href=\"{{waD}}\" target=\"_blank\" rel=\"noopener\" style=\"padding-left: 12px; padding-right: 12px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M4 20l1.3-3.9A8 8 0 1 1 8 19.3z\"><\/path><\/svg>Dejan<\/a>\n<a class=\"btn btn-solid\" href=\"{{waA}}\" target=\"_blank\" rel=\"noopener\" style=\"padding-left: 12px; padding-right: 12px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M4 20l1.3-3.9A8 8 0 1 1 8 19.3z\"><\/path><\/svg>Aleksandar<\/a>\n<a class=\"btn btn-solid\" href=\"{{waM}}\" target=\"_blank\" rel=\"noopener\" style=\"padding-left: 12px; padding-right: 12px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M4 20l1.3-3.9A8 8 0 1 1 8 19.3z\"><\/path><\/svg>Mikhail<\/a>\n<\/div>\n<div><button class=\"btn btn-ghost cpmsg\" type=\"button\" onClick=\"{{copyMsg}}\">{{copyMsgLabel}}<\/button><\/div>\n<div><button class=\"btn btn-ghost\" type=\"button\" onClick=\"{{reset}}\">Novi upit<\/button><\/div>\n<\/div>\n<\/sc-if>\n<div class=\"privw\">\n<button type=\"button\" class=\"privb\" onClick=\"{{priv.toggle}}\" aria-expanded=\"{{priv.exp}}\" aria-controls=\"privatnost\"><span>Politika privatnosti<\/span><i aria-hidden=\"true\" style=\"transform: rotate({{priv.rot}}deg)\">+<\/i><\/button>\n<div class=\"accw\" id=\"privatnost\" role=\"region\" aria-label=\"Politika privatnosti\" style=\"grid-template-rows: {{priv.rows}}\" aria-hidden=\"{{priv.hidden}}\"><div class=\"acc-in\"><div class=\"privtx\">\n<p><b>Ko obrađuje podatke.<\/b> FINMAT, Beograd. Kontakt: dej.bogdanovic@gmail.com, 060 306 7120.<\/p>\n<p><b>Koje podatke prikupljamo.<\/b> Samo ono što unesete u formu ili pošaljete porukom: ime, telefon, email, lokaciju, tip objekta, kvadraturu i opis posla.<\/p>\n<p><b>Zašto.<\/b> Da odgovorimo na vaš upit, dogovorimo izlazak na teren i pošaljemo ponudu. Podatke ne koristimo za reklame i ne prodajemo ih.<\/p>\n<p><b>Osnov.<\/b> Vaš zahtev pre zaključenja ugovora i vaš pristanak, koji možete povući u svakom trenutku.<\/p>\n<p><b>Koliko dugo.<\/b> Dok traje komunikacija o upitu, a najduže 12 meseci od poslednjeg kontakta, osim ako zakon ne traži duže čuvanje.<\/p>\n<p><b>Ko još vidi podatke.<\/b> Web3Forms, servis koji upit iz forme dostavlja na naš email, i WhatsApp ili Viber kada sami izaberete slanje porukom.<\/p>\n<p><b>Vaša prava.<\/b> Možete tražiti uvid, ispravku ili brisanje podataka i uložiti prigovor. Pišite nam na dej.bogdanovic@gmail.com. Pritužbu možete podneti i Povereniku za informacije od javnog značaja i zaštitu podataka o ličnosti.<\/p>\n<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- KONTAKT -->\n<section id=\"kontakt\" aria-labelledby=\"kon-h\" style=\"flex-grow: 1; padding: 96px 0\">\n<div style=\"box-sizing: border-box; width: 1180px; margin: 0 auto; padding: 0 40px\">\n<div style=\"max-width: 720px; margin: 0 auto 44px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px\">\n<p class=\"eyebrow\">Kontakt<\/p>\n<h2 class=\"h2\" id=\"kon-h\">Kontakt<\/h2>\n<div class=\"rule\" style=\"width: 90px\"><\/div>\n<p style=\"margin: 0; color: #C9C6C0\">Pozovite nas ili pošaljite poruku na Viber ili WhatsApp.<\/p>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n<article class=\"kc\" style=\"padding: 22px\">\n<div class=\"kc-hd\"><span class=\"kc-av\" aria-hidden=\"true\">DB<\/span><div><p class=\"kc-role\">Kontakt osoba<\/p><h3 class=\"kc-name\">Dejan Bogdanović<\/h3><\/div><\/div>\n<div class=\"kc-rows\">\n<div gn-items: center; text-align: center; gap: 18px\">\n<p class=\"eyebrow\">Galerija<\/p>\n<h2 class=\"h2\" id=\"rad-h\">Naši radovi<\/h2>\n<div class=\"rule\" style=\"width: 90px\"><\/div>\n<p style=\"margin: 0; color: #C9C6C0\">Izbor završenih projekata. Kliknite na fotografiju za veći prikaz.<\/p>\n<\/div>\n<div role=\"group\" aria-label=\"Filtriraj radove\" style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 32px\">\n<sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"5\">\n<button type=\"button\" class=\"chip\" onClick=\"{{f.pick}}\" aria-pressed=\"{{f.pressed}}\" style=\"flex-shrink: 0; background: {{f.bg}}; color: {{f.fg}}; border-color: {{f.border}}\">{{f.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 240px; grid-auto-flow: dense; gap: 16px\">\n<sc-for list=\"{{works}}\" as=\"w\" hint-placeholder-count=\"7\">\n<button type=\"button\" class=\"gtile\" onClick=\"{{w.open}}\" aria-label=\"{{w.aria}}\" style=\"grid-column: span {{w.cs}}; grid-row: span {{w.rs}}\">\n<sc-if value=\"{{w.notPp}}\" hint-placeholder-val=\"{{true}}\"><img class=\"gimg\" src=\"{{w.src}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><\/sc-if>\n<sc-if value=\"{{w.pp}}\" hint-placeholder-val=\"{{false}}\"><img class=\"gimg gl\" src=\"{{w.pre}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><img class=\"gimg gr\" src=\"{{w.post}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><span class=\"gline\"><\/span><span class=\"gpp\" style=\"left: 14px; border: 1px solid #ECEAE6; background: rgba(15,15,15,.7)\">PRE<\/span><span class=\"gpp\" style=\"left: calc(50% + 14px); background: #ECEAE6; color: #0F0F0F\">POSLE<\/span><\/sc-if>\n<span class=\"gcap\"><span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-family: 'Cormorant Garamond', Garamond, serif; font-size: 22px; font-weight: 500; line-height: 1.15\">{{w.title}}<\/span><\/span><\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<sc-if value=\"{{gMore}}\" hint-placeholder-val=\"{{true}}\"><div style=\"display: flex; justify-content: center; margin-top: 32px\"><button type=\"button\" class=\"btn btn-ghost\" onClick=\"{{gShowAll}}\" style=\"cursor: pointer; min-width: 300px\">{{gAllLabel}}<\/button><\/div><\/sc-if>\n<div style=\"display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #2B2A28\">\n<span style=\"font-size: 14px; letter-spacing: 0.08em; color: #95918A\">{{gCount}}<\/span>\n<\/div>\n\n<sc-if value=\"{{lbOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"dialog\" aria-modal=\"true\" aria-label=\"Veći prikaz fotografije\" style=\"position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; overflow-y: auto; box-sizing: border-box; padding: 40px 31px; background: rgba(12,12,12,0.97); display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n<span style=\"font-size: 12.48px; letter-spacing: 0.22em; text-transform: uppercase; color: #95918A\">{{lb.cat}} · {{lb.num}} / {{lb.total}}<\/span>\n<button type=\"button\" onClick=\"{{lb.close}}\" aria-label=\"Zatvori galeriju\" style=\"min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 10px; background: none; border: 1px solid #ECEAE6; color: #ECEAE6; cursor: pointer; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase\">Zatvori <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M5 5l14 14M19 5L5 19\"><\/path><\/svg><\/button>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 20px\"><button type=\"button\" class=\"lbbtn\" onClick=\"{{lb.prev}}\" aria-label=\"Prethodna fotografija\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-wi tan izlazak na teren.<\/p>\n<\/div>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; color: #4A4740\">\n<li style=\"display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#141413\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"margin-top: 5px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg>Besplatna procena i merenje<\/li>\n<li style=\"display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#141413\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"margin-top: 5px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg>Ponuda po stavkama, bez skrivenih troškova<\/li>\n<li style=\"display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#141413\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"margin-top: 5px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><span>Više volite telefon? <a href=\"#kontakt\">Pozovite nas direktno<\/a><\/span><\/li>\n<\/ul>\n<\/aside>\n<div>\n<sc-if value=\"{{notSent}}\" hint-placeholder-val=\"{{true}}\">\n<form style=\"background: #171716; border: 1px solid #2B2A28; padding: 31px; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-ime\">Ime i prezime<\/label><input class=\"inp\" id=\"dt-ime\" type=\"text\" autocomplete=\"name\" value=\"{{v.ime}}\" onChange=\"{{on.ime}}\" style=\"border-color: {{v.imeBorder}}\"><sc-if value=\"{{v.errIme}}\" hint-placeholder-val=\"{{false}}\"><span style=\"color: #943A2C; font-size: 13.6px\">Unesite ime.<\/span><\/sc-if><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-tel\">Telefon<\/label><input class=\"inp\" id=\"dt-tel\" type=\"tel\" autocomplete=\"tel\" inputmode=\"tel\" placeholder=\"06x xxx xxxx\" value=\"{{v.tel}}\" onChange=\"{{on.tel}}\" style=\"border-color: {{v.telBorder}}\"><sc-if value=\"{{v.errTel}}\" hint-placeholder-val=\"{{false}}\"><span style=\"color: #943A2C; font-size: 13.6px\">Unesite broj telefona da bismo vas pozvali.<\/span><\/sc-if><\/div>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-mail\">Email <em>(nije obavezno)<\/em><\/label><input class=\"inp\" id=\"dt-mail\" type=\"email\" autocomplete=\"email\" value=\"{{v.mail}}\" onChange=\"{{on.mail}}\" style=\"border-color: {{v.mailBorder}}\"><sc-if value=\"{{v.errMail}}\" hint-placeholder-val=\"{{false}}\"><span style=\"color: #943A2C; font-size: 13.6px\">Proverite email adresu.<\/span><\/sc-if><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-mesto\">Lokacija<\/label><input class=\"inp\" id=\"dt-mesto\" type=\"text\" placeholder=\"npr. Beograd, Zvezdara\" value=\"{{v.mesto}}\" onChange=\"{{on.mesto}}\"><\/div>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-obj\">Tip objekta<\/label><select class=\"inp\" id=\"dt-obj\" value=\"{{v.obj}}\" onChange=\"{{on.obj}}\"><option>Stan<\/option><option>Kuća<\/option><option>Poslovni prostor<\/option><option>Drugo<\/option><\/select><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-m2\">Kvadratura <em>(m², okvirno)<\/em><\/label><input class=\"inp\" id=\"dt-m2\" type=\"text\" inputmode=\"numeric\" placeholder=\"npr. 60\" value=\"{{v.m2}}\" onChange=\"{{on.m2}}\"><\/div>\n<\/div>\n<div style=\"position: relative; display: flex; flex-direction: column; gap: 8px\">\n<span class=\"lbl\" id=\"t-svc-l\">Šta je potrebno <em>(može više usluga)<\/em><\/span>\n<button type=\"button\" class=\"inp\" onClick=\"{{toggleSvc}}\" aria-expanded=\"{{svcExpanded}}\" aria-controls=\"t-svc-list\" aria-labelledby=\"t-svc-l\" style=\"min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; cursor: pointer; border-color: {{svcBorder}}\">\n<span style=\"min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{svcSumColor}}\">{{svcSummary}}<\/span>\n<span style=\"flex-shrink: 0; display: flex; align-items: center; gap: 10px\">\n<sc-if value=\"{{svcAny}}\" hint-placeholder-val=\"{{false}}\"><span style=\"min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 7px; border-radius: 12px; background: #141413; color: #F6F4F0; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center\">{{svcCount}}<\/span><\/sc-if>\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#141413\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"transform: rotate({{svcRot}}deg); transition: transform .2s\"><path d=\"M6 9l6 6 6-6\"><\/path><\/svg>\n<\/span>\n<\/button>\n<sc-if value=\"{{svcOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div id=\"t-svc-list\" role=\"group\" aria-label=\"Usluge\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: -1px; box-sizing: border-box; border: 1px solid #141413; background: #FBFAF7; box-shadow: 0 16px 40px rgba(20,20,19,0.18)\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))\">\n<sc-for list=\"{{svcs}}\" as=\"s\" hint-placeholder-count=\"11\">\n<button type=\"button\" role=\"checkbox\" aria-checked=\"{{s.pressed}}\" onClick=\"{{s.pick}}\" style=\"width: 100%; min-height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: {{s.rowBg}}; border: 0; border-bottom: 1px solid #E2DDD5; color: #141413; font: 400 15px/1.3 'Jost', sans-serif; text-align: left; cursor: pointer\">\n<span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border: 1px solid #141413; background: {{s.boxBg}}; display: flex; align-items: center; justify-content: center\"><sc-if value=\"{{s.on}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FBFAF7\" stroke-width=\"2.4\" aria-hidden=\"true\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><\/sc-if><\/span>\n{{s.label}}\n<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; justify-content: flex-end; gap: 8px; padding: 12px 14px\">\n<button type=\"button\" onClick=\"{{clearSvc}}\" style=\"min-width: 140px; min-height: 44px; background: none; border: 1px solid #CFC9BF; color: #4A4740; cursor: pointer; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase\">Poništi<\/button>\n<button type=\"button\" onClick=\"{{closeSvc}}\" style=\"min-width: 140px; min-height: 44px; background: #141413; border: 0; color: #F6F4F0; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase\">Gotovo<\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-opis\">Opis posla <em>(nije obavezno)<\/em><\/label><textarea class=\"inp\" id=\"dt-opis\" placeholder=\"Npr. kompletno renoviranje kupatila, zamena instalacija, stan je prazan...\" value=\"{{v.opis}}\" onChange=\"{{on.opis}}\"><\/textarea><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-kontakt\">Kako da vas kontaktiramo<\/label><select class=\"inp\" id=\"dt-kontakt\" value=\"{{v.kontakt}}\" onChange=\"{{on.kontakt}}\"><option>Poziv<\/option><option>Viber<\/option><option>WhatsApp<\/option><option>Email<\/option><\/select><\/div>\n<button class=\"btn btn-solid\" type=\"button\" onClick=\"{{send}}\" aria-busy=\"{{sendBusy}}\" style=\"align-self: flex-start\">{{sendLabel}}<\/button>\n<input type=\"checkbox\" name=\"botcheck\" class=\"hp\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" onChange=\"{{hpOn}}\">\n<p style=\"margin: 0; font-size: 13.12px; color: #5C5850\">Vaše podatke koristimo samo da bismo odgovorili na upit. Detalji su u politici privatnosti ispod forme.<\/p>\n<\/form>\n<\/sc-if>\n<sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"sentcard\" data-st=\"{{mailState}}\" role=\"status\" aria-live=\"polite\" style=\"display: flex; flex-direction: column; gap: 18px; background: #171716; border: 1px solid #2B2A28; padding: 28px; color: #ECEAE6; box-shadow: 0 18px 40px rgba(20,20,19,.18)\">\n<p class=\"eyebrow\">{{sentEyebrow}}<\/p>\n<h3 class=\"sf\" style=\"margin: 0; font-size: 32px; font-weight: 500; line-height: 1.08\">{{sentTitle}}<\/h3>\n<p style=\"margin: 0\">{{sentText}}<\/p>\n<sc-if value=\"{{showMsg}}\" hint-placeholder-val=\"{{true}}\"><pre style=\"white-space: pre-wrap; font: 400 14.72px/1.55 'Jost', sans-serif; background: #FFFFFF; border: 1px solid #CFC9BF; padding: 16px; margin: 0; max-height: 260px; overflow: auto\">{{msg}}<\/pre><\/sc-if>\n<p class=\"lbl\" style=\"margin: 4px 0 -6px\">{{waLabel}}<\/p>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n<a class=\"btn btn-solid\" href=\"{{waD}}\" target=\"_blank\" rel=\"noopener\" style=\"padding-left: 12px; padding-right: 12px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M4 20l1.3-3.9A8 8 0 1 1 8 19.3z\"><\/path><\/svg>Dejan<\/a>\n<a class=\"btn btn-solid\" href=\"{{waA}}\" target=\"_blank\" rel=\"noopener\" style=\"padding-le
