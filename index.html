aže starog do useljivog prostora. Jedan tim, jedan rok, jedna cena: vodimo sve radove i predajemo vam ključeve.<\/p><\/a>\n<div class=\"svcl\">\n<a class=\"svcr\" href=\"#upit\" onClick=\"{{pk.elektro}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M23 4L11 22h9l-3 14 12-19h-9z\"><\/path><\/svg><span>Elektro instalacije<\/span><i aria-hidden=\"true\">→<\/i><\/a>\n<a class=\"svcr\" href=\"#upit\" onClick=\"{{pk.vodovod}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M20 5c-6 9-10 14-10 20a10 10 0 0 0 20 0c0-6-4-11-10-20z\"><\/path><\/svg><span>Vodovodne instalacije<\/span><i aria-hidden=\"true\">→<\/i><\/a>\n<a class=\"svcr\" href=\"#upit\" onClick=\"{{pk.malter}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M6 34l6-14 8 8zM16 24l12-12M26 10l4-4 4 4-4 4\"><\/path><\/svg><span>Malterisanje<\/span><i aria-hidden=\"true\">→<\/i><\/a>\n<a class=\"svcr\" href=\"#upit\" onClick=\"{{pk.keramika}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><rect x=\"6\" y=\"6\" width=\"28\" height=\"28\"><\/rect><path d=\"M20 6v28M6 20h28M6 13l7-7M27 34l7-7M13 34a7 7 0 0 1 7-7M20 13a7 7 0 0 1 7-7\"><\/path><\/svg><span>Keramičarski radovi<\/span><i aria-hidden=\"true\">→<\/i><\/a>\n<a class=\"svcr\" href=\"#upit\" onClick=\"{{pk.gips}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M8 32l18-24 6 6-20 20H8zM8 32l4-4\"><\/path><\/svg><span>Gipsarski radovi<\/span><i aria-hidden=\"true\">→<\/i><\/a>\n<a class=\"svcr\" href=\"#upit\" onClick=\"{{pk.moler}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><rect x=\"8\" y=\"5\" width=\"22\" height=\"8\"><\/rect><path d=\"M30 9h3v8H19v5M17 22h4v13h-4z\"><\/path><\/svg><span>Molerski radovi<\/span><i aria-hidden=\"true\">→<\/i><\/a>\n<a class=\"svcr\" href=\"#upit\" onClick=\"{{pk.obloge}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M20 8l14 6-14 6-14-6zM6 20l14 6 14-6M6 26l14 6 14-6\"><\/path><\/svg><span>Podne i zidne obloge<\/span><i aria-hidden=\"true\">→<\/i><\/a>\n "f\" hint-placeholder-count=\"5\">\n<button type=\"button\" class=\"chip\" onClick=\"{{f.pick}}\" aria-pressed=\"{{f.pressed}}\" style=\"flex-shrink: 0; background: {{f.bg}}; color: {{f.fg}}; border-color: {{f.border}}\">{{f.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 260px; grid-auto-flow: dense; gap: 16px\">\n<sc-for list=\"{{works}}\" as=\"w\" hint-placeholder-count=\"7\">\n<button type=\"button\" class=\"gtile\" onClick=\"{{w.open}}\" aria-label=\"{{w.aria}}\" style=\"grid-column: span {{w.cs}}; grid-row: span {{w.rs}}\">\n<sc-if value=\"{{w.notPp}}\" hint-placeholder-val=\"{{true}}\"><img class=\"gimg\" src=\"{{w.src}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><\/sc-if>\n<sc-if value=\"{{w.pp}}\" hint-placeholder-val=\"{{false}}\"><img class=\"gimg gl\" src=\"{{w.pre}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><img class=\"gimg gr\" src=\"{{w.post}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><span class=\"gline\"><\/span><span class=\"gpp\" style=\"left: 14px; border: 1px solid #ECEAE6; background: rgba(15,15,15,.7)\">PRE<\/span><span class=\"gpp\" style=\"left: calc(50% + 14px); background: #ECEAE6; color: #0F0F0F\">POSLE<\/span><\/sc-if>\n<span class=\"gcap\"><span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-family: 'Cormorant Garamond', Garamond, serif; font-size: 22px; font-weight: 500; line-height: 1.15\">{{w.title}}<\/span><\/span><\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<sc-if value=\"{{gMore}}\" hint-placeholder-val=\"{{true}}\"><div style=\"display: flex; justify-content: center; margin-top: 32px\"><button type=\"button\" class=\"btn btn-ghost\" onClick=\"{{gShowAll}}\" style=\"cursor: pointer; min-width: 300px\">{{gAllLabel}}<\/button><\/div><\/sc-if>\n<div style=\"display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #2B2A28\">\n<span style=\"font-size: 14px; letter-spacing: 0.08em; color: #95918A\">{{gCount}}<\/span>\n<\/div>\n<\/div>\n<sc-if value=\"{{lbOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"dialog\" aria-modal=\"true\" aria-label=\"Veći prikaz fotografije\" style=\"position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; overflow-y: auto; box-sizing: border-box; padding: 48px 120px; background: rgba(12,12,12,0.97); display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n<span style=\"font-size: 12.48px; letter-spacing: 0.22em; text-transform: uppercase; color: #95918A\">{{lb.cat}} · {{lb.num}} / {{lb.total}}<\/span>\n<button type=\"button\" onClick=\"{{lb.close}}\" aria-label=\"Zatvori galeriju\" style=\"min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 10px; background: none; border: 1px solid #ECEAE6; color: #ECEAE6; cursor: pointer; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase\">Zatvori <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M5 5l14 14M19 5L5 19\"><\/path><\/svg><\/button>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 20px\"><button type=\"button\" class=\"lbbtn\" onClick=\"{{lb.prev}}\" aria-label=\"Prethodna fotografija\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"><\/path><\/svg><\/button>\n<div style=\"position: relative; flex-grow: 1; height: 620px; box-sizing: border-box; border: 1px solid #2B2A28; background: #0B0B0B; overflow: hidden\">\n<sc-if value=\"{{lb.one}}\" hint-placeholder-val=\"{{true}}\"><img class=\"lbi\" src=\"{{lb.src}}\" alt=\"{{lb.alt}}\"><\/sc-if>\n<sc-if value=\"{{lb.cmp}}\" hint-placeholder-val=\"{{false}}\"><img class=\"lbc\" src=\"{{lb.pre}}\" alt=\"Pre ra essed}}\" style=\"flex-shrink: 0; background: {{md.bg}}; color: {{md.fg}}; border-color: {{md.border}}\">{{md.label}}<\/button>\n<\/sc-for>\n<\/div><\/sc-if>\n<div style=\"display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px\">\n<sc-for list=\"{{thumbs}}\" as=\"t\" hint-placeholder-count=\"7\">\n<button type=\"button\" class=\"gthumb\" onClick=\"{{t.pick}}\" aria-label=\"{{t.aria}}\" aria-current=\"{{t.current}}\" style=\"border-color: {{t.border}}; opacity: {{t.op}}\"><img class=\"gti\" src=\"{{t.src}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/section>\n\n<!-- ZAŠTO FINMAT -->\n<section id=\"zasto\" class=\"lt\" aria-labelledby=\"zasto-h\" style=\"flex-shrink: 0; padding: 64px 31px\">\n<div style=\"margin: 0 0 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px\">\n<p class=\"eyebrow\">Zašto FINMAT<\/p>\n<h2 class=\"h2\" id=\"zasto-h\">Zašto izabrati nas<\/h2>\n<div class=\"rule\" style=\"width: 90px\"><\/div>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n<article class=\"zf\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M20 6l14 7-14 7-14-7z\"><\/path><path d=\"M6 20l14 7 14-7\"><\/path><path d=\"M6 27l14 7 14-7\"><\/path><\/svg><div class=\"zf-t\"><h3>Sve na jednom mestu<\/h3><p>Instalacije, gips, keramika, moleraj, podovi i stolarija. Jedan tim vodi ceo posao, ne tražite pet različitih majstora.<\/p><\/div><span class=\"zf-n\" aria-hidden=\"true\">01<\/span><\/article>\n<article class=\"zf\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M10 5h14l7 7v23H10z\"><\/path><path d=\"M24 5v7h7M15 19h11M15 24h11M15 29h7\"><\/path><\/svg><div class=\"zf-t\"><h3>Cena poznata unapred<\/h3><p>Pre početka dobijate pisanu ponudu po stavkama. Plaćate ono što je dogovoreno, bez skrivenih troškova.<\/p><\/div><span class=\"zf-n\" aria-hidden=\"true\">02<\/span><\/article>\n<article class=\"zf\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><rect x=\"6\" y=\"9\" width=\"28\" height=\"25\"><\/rect><path d=\"M6 16h28M13 5v7M27 5v7M14 25l4 4 8-8\"><\/path><\/svg><div class=\"zf-t\"><h3>Rok koji se poštuje<\/h3><p>Dinamiku radova znate unapred, a mi vas redovno obaveštavamo kako posao napreduje.<\/p><\/div><span class=\"zf-n\" aria-hidden=\"true\">03<\/span><\/article>\n<article class=\"zf\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M4 20s6-11 16-11 16 11 16 11-6 11-16 11S4 20 4 20z\"><\/path><circle cx=\"20\" cy=\"20\" r=\"5\"><\/circle><\/svg><div class=\"zf-t\"><h3>Rezultat koji se vidi<\/h3><p>Pazimo na detalje, od fuga do skrivene rasvete. Pogledajte naše radove pre i posle u galeriji.<\/p><\/div><span class=\"zf-n\" aria-hidden=\"true\">04<\/span><\/article>\n<\/div>\n<\/section>\n\n<!-- KLJUČ U RUKE -->\n<section id=\"kljuc-u-ruke\" aria-labelledby=\"tk-h\" style=\"flex-shrink: 0; padding: 64px 31px; background: #1D1D1C; display: flex; flex-direction: column; gap: 46px\">\n<div>\n<div style=\"margin-bottom: 56px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px\">\n<p class=\"eyebrow\" style=\"color: #9A968F\">Sistem rada<\/p>\n<h2 class=\"h2\" id=\"tk-h\">Ključ u ruke<\/h2>\n<div class=\"rule\" style=\"width: 90px\"><\/div>\n<p style=\"margin: 0; color: #9A968F\">Ne morate da tražite i usklađujete pet različitih majstora. Mi preuzimamo ceo posao i odgovaramo za njega od početka do kraja.<\/p>\n<\/div>\n<ul style=\"list-style: none; margin: 0; padding: 0; border-top: 1px solid #33322F\">\n<li style=\"display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding: 18px 0; border-bottom: 1px solid #33322F\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ECEAE6\" stroke-width=\"1.5\" aria-hidden=\"true\" style=\"margin-top: 4px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><div><b style=\"display: block; font-weight: 500\">Jedna ponuda za sve radove<\/b><span ss=\"aibox\">\n<div class=\"aihd\"><span class=\"aidot\" aria-hidden=\"true\"><\/span><label class=\"lbl\" for=\"t-aiq\" style=\"color: #ECEAE6\">Niste našli odgovor? Pitajte nas<\/label><\/div>\n<p style=\"margin: 0; font-size: 14.4px; color: #9A968F\">Upišite pitanje, odgovara AI asistent FINMAT-a.<\/p>\n<div style=\"display: flex; gap: 10px; margin-top: 14px\"><input class=\"inp\" id=\"t-aiq\" type=\"text\" autocomplete=\"off\" placeholder=\"npr. Da li radite kupatila u Novom Sadu?\" value=\"{{ai.q}}\" onChange=\"{{ai.input}}\" onKeyDown=\"{{ai.key}}\" style=\"min-width: 0; flex-grow: 1\"><button type=\"button\" class=\"btn btn-solid\" onClick=\"{{ai.ask}}\" style=\"flex-shrink: 0\">Pitaj<\/button><\/div>\n<sc-if value=\"{{ai.wait}}\" hint-placeholder-val=\"{{false}}\"><div class=\"aians\"><span class=\"aiwait\" aria-live=\"polite\"><i><\/i><i><\/i><i><\/i>&nbsp;Asistent piše odgovor<\/span><\/div><\/sc-if>\n<sc-if value=\"{{ai.has}}\" hint-placeholder-val=\"{{false}}\"><div class=\"aians\" aria-live=\"polite\">\n<p class=\"lbl\" style=\"margin: 0 0 10px; color: #95918A\">Vaše pitanje: <em style=\"text-transform: none; letter-spacing: .02em; color: #C9C6C0\">{{ai.asked}}<\/em><\/p>\n<p class=\"aitxt\">{{ai.a}}<\/p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 16px; font-size: 12.48px; letter-spacing: .14em; text-transform: uppercase\"><button type=\"button\" onClick=\"{{ai.reset}}\" style=\"background: none; border: 0; padding: 0; color: #95918A; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit\">Novo pitanje<\/button><\/div>\n<\/div><\/sc-if>\n<p style=\"margin: 14px 0 0; font-size: 12.8px; color: #95918A\">Odgovor je informativan. Tačnu cenu i rok dobijate u ponudi posle izlaska na teren.<\/p>\n<\/div>\n<\/section>\n\n<!-- UPIT -->\n<section id=\"upit\" class=\"lt\" aria-labelledby=\"upit-h\" style=\"flex-shrink: 0; padding: 64px 31px; background: #ECEAE6; display: flex; flex-direction: column; gap: 46px\">\n<aside style=\"display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 18px\">\n<p class=\"eyebrow\">Upit<\/p>\n<h2 class=\"h2\" id=\"upit-h\">Zatražite ponudu<\/h2>\n<div class=\"rule\" style=\"width: 90px\"><\/div>\n<p style=\"margin: 0; color: #4A4740\">Popunite formu za manje od minut. Javićemo vam se da dogovorimo besplatan izlazak na teren.<\/p>\n<\/div>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; color: #4A4740\">\n<li style=\"display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#141413\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"margin-top: 5px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg>Besplatna procena i merenje<\/li>\n<li style=\"display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#141413\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"margin-top: 5px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg>Ponuda po stavkama, bez skrivenih troškova<\/li>\n<li style=\"display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#141413\" stroke-width=\"1.6\" aria-hidden=\"true\" style=\"margin-top: 5px\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><span>Više volite telefon? <a href=\"#kontakt\">Pozovite nas direktno<\/a><\/span><\/li>\n<\/ul>\n<\/aside>\n<div>\n<sc-if value=\"{{notSent}}\" hint-placeholder-val=\"{{true}}\">\n<form style=\"background: #171716; border: 1px solid #2B2A28; padding: 31px; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label cla -1px; box-sizing: border-box; border: 1px solid #141413; background: #FBFAF7; box-shadow: 0 16px 40px rgba(20,20,19,0.18)\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))\">\n<sc-for list=\"{{svcs}}\" as=\"s\" hint-placeholder-count=\"11\">\n<button type=\"button\" role=\"checkbox\" aria-checked=\"{{s.pressed}}\" onClick=\"{{s.pick}}\" style=\"width: 100%; min-height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: {{s.rowBg}}; border: 0; border-bottom: 1px solid #E2DDD5; color: #141413; font: 400 15px/1.3 'Jost', sans-serif; text-align: left; cursor: pointer\">\n<span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border: 1px solid #141413; background: {{s.boxBg}}; display: flex; align-items: center; justify-content: center\"><sc-if value=\"{{s.on}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FBFAF7\" stroke-width=\"2.4\" aria-hidden=\"true\"><path d=\"M4 12.5l5 5L20 6.5\"><\/path><\/svg><\/sc-if><\/span>\n{{s.label}}\n<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; justify-content: flex-end; gap: 8px; padding: 12px 14px\">\n<button type=\"button\" onClick=\"{{clearSvc}}\" style=\"min-width: 140px; min-height: 44px; background: none; border: 1px solid #CFC9BF; color: #4A4740; cursor: pointer; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase\">Poništi<\/button>\n<button type=\"button\" onClick=\"{{closeSvc}}\" style=\"min-width: 140px; min-height: 44px; background: #141413; border: 0; color: #F6F4F0; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase\">Gotovo<\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\"><label class=\"lbl\" for=\"dt-opis\">Opis posla <em>(nije obavezno)<\/em><\/label><textarea class= }\" style=\"flex-shrink: 0; background: {{f.bg}}; color: {{f.fg}}; border-color: {{f.border}}\">{{f.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 150px; grid-auto-flow: dense; gap: 8px\">\n<sc-for list=\"{{works}}\" as=\"w\" hint-placeholder-count=\"7\">\n<button type=\"button\" class=\"gtile\" onClick=\"{{w.open}}\" aria-label=\"{{w.aria}}\" style=\"grid-column: span {{w.cs}}; grid-row: span {{w.rs}}\">\n<sc-if value=\"{{w.notPp}}\" hint-placeholder-val=\"{{true}}\"><img class=\"gimg\" src=\"{{w.src}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><\/sc-if>\n<sc-if value=\"{{w.pp}}\" hint-placeholder-val=\"{{false}}\"><img class=\"gimg gl\" src=\"{{w.pre}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><img class=\"gimg gr\" src=\"{{w.post}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><span class=\"gline\"><\/span><span class=\"gpp\" style=\"left: 14px; border: 1px solid #ECEAE6; background: rgba(15,15,15,.7)\">PRE<\/span><span class=\"gpp\" style=\"left: calc(50% + 14px); background: #ECEAE6; color: #0F0F0F\">POSLE<\/span><\/sc-if>\n<span class=\"gcap\"><span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-family: 'Cormorant Garamond', Garamond, serif; font-size: 19px; font-weight: 500; line-height: 1.15\">{{w.title}}<\/span><\/span><\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<sc-if value=\"{{gMore}}\" hint-placeholder-val=\"{{true}}\"><button type=\"button\" class=\"btn btn-ghost full\" onClick=\"{{gShowAll}}\" style=\"width: 100%; margin-top: 16px; cursor: pointer\">{{gAllLabel}}<\/button><\/sc-if>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 24px\">\n<span style=\"font-size: 14px; letter-spacing: 0.08em; color: #95918A\">{{gCount}}<\/span>\n<\/div>\n\n<sc-if value=\"{{lbOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"dialog\" aria-modal=\"true\" aria-label=\"Veći prikaz fotografije\" style=\"position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; overflow-y: auto; box-sizing: border-box; padding: 24px 16px; background: rgba(12,12,12,0.97); display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n<span style=\"font-size: 12.48px; letter-spacing: 0.22em; text-transform: uppercase; color: #95918A\">{{lb.cat}} · {{lb.num}} / {{lb.total}}<\/span>\n<button type=\"button\" onClick=\"{{lb.close}}\" aria-label=\"Zatvori galeriju\" style=\"min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 10px; background: none; border: 1px solid #ECEAE6; color: #ECEAE6; cursor: pointer; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase\">Zatvori <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M5 5l14 14M19 5L5 19\"><\/path><\/svg><\/button>\n<\/div>\n<div style=\"position: relative; flex-grow: 0; flex-shrink: 0; height: 460px; box-sizing: border-box; border: 1px solid #2B2A28; background: #0B0B0B; overflow: hidden\">\n<sc-if value=\"{{lb.one}}\" hint-placeholder-val=\"{{true}}\"><img class=\"lbi\" src=\"{{lb.src}}\" alt=\"{{lb.alt}}\"><\/sc-if>\n<sc-if value=\"{{lb.cmp}}\" hint-placeholder-val=\"{{false}}\"><img class=\"lbc\" src=\"{{lb.pre}}\" alt=\"Pre radova: {{lb.title}}\" style=\"left: 0\"><img class=\"lbc\" src=\"{{lb.post}}\" alt=\"Posle radova: {{lb.title}}\" style=\"left: 50%\"><span class=\"gline\"><\/span><span class=\"gpp\" style=\"left: 16px; border: 1px solid #ECEAE6; background: rgba(15,15,15,.7)\">PRE<\/span><span class=\"gpp\" style=\"left: calc(50% + 16px); background: #ECEAE6; color: #0F0F0F\">POSLE<\/span><\/sc-if>\n<sc-if value=\"{{lb.solo}}\" hint-placeholder-val=\"{{false}}\"><span class=\"gpp\" style=\"left: 16px; background: #ECEAE6; color: #0F0F0F\">{{lb.mode}}<\/span><\/sc-if>\n<\/div>\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\"><button type=\"button\" class=\"lbbtn\" onClick=\"{{lb.prev}}\" aria-label=\"Prethodna fotografija\" style=\"width: 48px; height: 48px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"><\/path><\/svg><\/button><span style=\"font-size: 13px; letter-spacing: 0.16em; color: #C9C6C0\">{{lb.num}} / {{lb.total}}<\/span><button type=\"button\" class=\"lbbtn\" onClick=\"{{lb.next}}\" aria-label=\"Sledeća fotografija\" style=\"width: 48px; height: 48px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M9 5l7 7-7 7\"><\/path><\/svg><\/button><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-family: 'Cormorant Garamond', Garamond, serif; font-size: 26px; font-weight: 500; line-height: 1.1\">{{lb.title}}<\/span>\n<span style=\"font-size: 15px; color: #C9C6C0\">{{lb.tag}}<\/span>\n<\/div>\n<sc-if value=\"{{lb.pp}}\" hint-placeholder-val=\"{{false}}\"><div role=\"group\" aria-label=\"Prikaz pre i posle\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{lbModes}}\" as=\"md\" hint-placeholder-count=\"3\">\n<button type=\"button\" class=\"chip\" onClick=\"{{md.pick}}\" aria-pressed=\"{{md.pressed}}\" style=\"flex-shrink: 0; background: {{md.bg}}; color: {{md.fg}}; border-color: {{md.border}}\">{{md.label}}<\/button>\n<\/sc-for>\n<\/div><\/sc-if>\n<div style=\"display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px\">\n<sc-for list=\"{{thumbs}}\" as=\"t\" hint-placeholder-count=\"7\">\n<button type=\"button\" class=\"gthumb\" onClick=\"{{t.pick}}\" aria-label=\"{{t.aria}}\" aria-current=\"{{t.current}}\" style=\"border-color: {{t.border}}; opacity: {{t.op}}\"><img class=\"gti\" src=\"{{t.src}}\" alt=\"\" loading=\"lazy\" decoding=\"async\"><\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/section>\n\n<!-- ZAŠTO FINMAT -->\n<section id=\"zasto\" class=\"lt\" aria-labelledby=\"zasto-h\" aria-roledescription=\"slajder\" style=\"flex-shrink: 0; padding: 56px 0; overflow: hidden\">\n<div style=\"margin: 0 16px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px\">\n<p class=\"eyebrow\">Zašto FINMAT<\/p>\n<h2 class=\"h2\" id=\"zasto-h\">Zašto izabrati nas<\/h2>\n<div class=\"rule\" style=\"width: 90px\"><\/div>\n<p style=\"margin: 0; font-size: 15.2px; color: #6B675F\">Prevucite ili koristite strelice · {{zs.num}} / 4<\/p>\n<\/div>\n<div class=\"zfs\" style=\"overflow: hidden\">\n<div style=\"display: flex; gap: 12px; transform: translateX(calc(50% - {{zs.x}}px)); -webkit-transform: translateX(calc(50% - {{zs.x}}px)); transition: transform .35s ease\">\n<article class=\"zf\" aria-roledescription=\"slajd\" aria-label=\"Razlog 1 od 4\" style=\"opacity: {{zs.o0}}; border-color: {{zs.b0}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M20 6l14 7-14 7-14-7z\"><\/path><path d=\"M6 20l14 7 14-7\"><\/path><path d=\"M6 27l14 7 14-7\"><\/path><\/svg><div class=\"zf-t\"><h3>Sve na jednom mestu<\/h3><p>Instalacije, gips, keramika, moleraj, podovi i stolarija. Jedan tim vodi ceo posao, ne tražite pet različitih majstora.<\/p><\/div><span class=\"zf-n\" aria-hidden=\"true\">01<\/span><\/article>\n<article class=\"zf\" aria-roledescription=\"slajd\" aria-label=\"Razlog 2 od 4\" style=\"opacity: {{zs.o1}}; border-color: {{zs.b1}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M10 5h14l7 7v23H10z\"><\/path><path d=\"M24 5v7h7M15 19h11M15 24h11M15 29h7\"><\/path><\/svg><div class=\"zf-t\"><h3>Cena poznata unapred<\/h3><p>Pre početka dobijate pisanu ponudu po stavkama. Plaćate ono što je dogovoreno, bez skrivenih troškova.<\/p><\/div><span class=\"zf-n\" aria-hidden=\"true\">02<\/span><\/article>\n<article class=\"zf\" aria-roledescription=\"slajd\" aria-label=\"Razlog 3 od 4\" style=\"opacity: {{zs.o2}}; border-color: {{zs.b2}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><rect x=\"6\" y=\"9\" width=\"28\" height=\"25\"><\/rect><path d=\"M6 16h28M13 5v7M27 5v7M14 25l4 4 8-8\"><\/path><\/svg><div class=\"zf-t\"><h3>Rok koji se poštuje<\/h3><p>Dinamiku radova znate unapred, a mi vas redovno obaveštavamo kako posao napreduje.<\/p><\/div><span class=\"zf-n\" aria-hidden=\"true\">03<\/span><\/article>\n<article class=\"zf\" aria-roledescription=\"slajd\" aria-label=\"Razlog 4 od 4\" style=\"opacity: {{zs.o3}}; border-color: {{zs.b3}}\"><svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><path d=\"M4 20s6-11 16-11 16 11 16 11-6 11-16 11S4 20 4 20z\"><\/path><circle cx=\"20\" cy=\"20\" r=\"5\"><\/circle><\/svg><div class=\"zf-t\"><h3>Rezultat koji se vidi<\/h3><p>Pazimo na detalje, od fuga do skrivene rasvete. Pogledajte naše radove pre i posle u galeriji.<\/p><\/div><span class=\"zf-n\" aria-hidden=\"true\">04<\/span><\/article>\n<\/div>\n<\/div>\n<div style=\"margin: 24px 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n<button type=\"button\" onClick=\"{{zs.prev}}\" aria-label=\"Prethodni razlog\" style=\"width: 48px; height: 48px; border-radius: 50%; border: 1px solid {{zs.pb}}; background: none; color: #141413; opacity: {{zs.po}}; display: flex; align-items: center; justify-content: center; cursor: pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"><\/path><\/svg><\/button>\n<div role=\"tablist\" aria-label=\"Izaberite razlog\" style=\"display: flex; gap: 4px\">\n<button type=\"button\" role=\"tab\" onClick=\"{{zs.g0}}\" aria-selected=\"{{zs.s0}}\" aria-label=\"Razlog 1\" style=\"width: 32px; height: 44px; padding: 0; background: none; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center\"><span style=\"displ <script>
/* FINMAT – mali runtime za šablone (sc-for, sc-if, {{vrednosti}}) i stanje stranice */
(function () {
  'use strict';
  var WEB3FORMS_KEY = ''; // upišite ključ sa web3forms.com da upiti stižu na email
  var BP_TABLET = 600, BP_DESKTOP = 1200;
  var STATE = {};
  var app = document.getElementById('app');
  var cssEl = document.getElementById('layout-css');
  var cur = null, comps = [], tpls = [], pending = false, posted = false;

  function DCLogic() {}

  function interp(str, scope) {

  }

    var kids = src.childNodes;
    for (var i = 0; i < kids.length; i++) {
